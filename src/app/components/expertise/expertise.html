<section class="expertise section" id="expertise">
  <div class="container">
    <div class="section-header">
      <div class="accent-rule"></div>
      <span class="section-label">OUR EXPERTISE</span>
      <h2 class="h2-section">Industries &amp; Functions We Serve</h2>
    </div>
    <div class="expertise__grid">
      <div class="expertise__column">
        <h3 class="expertise__col-title">Industries</h3>
        <div class="expertise__pills">
          <span class="expertise__pill" *ngFor="let industry of industries">{{ industry }}</span>
        </div>
      </div>
      <div class="expertise__column">
        <h3 class="expertise__col-title">Business Functions</h3>
        <div class="expertise__pills">
          <span class="expertise__pill" *ngFor="let fn of businessFunctions">{{ fn }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
